#:schema https://secretspec.dev/schema/secretspec.schema.json
# Model keys for live model runs: `bun run eval`, `bun run intake` and the server's chat model,
# the SMTP login hex forwards Documents with, the IMAP login it reads the intake mailbox with, and
# the Slack tokens of its socket-mode chat channel.
# Never needed by tests or CI. The devenv shell exports them on entry (devenv.nix `enterShell`;
# see README "Development shell and model keys"). Optional, so the shell opens without them; a
# model call without its key fails, an enabled Forwarding target without the SMTP login fails
# startup and `bun run intake`, a mailbox section without the IMAP login fails startup, and so
# does a Slack channel without its tokens.

[project]
name = "hex"
revision = "1.0"

# Vault "Hex" in the maintainer's 1Password account `my.1password.com`. Each key is a Secure Note
# `secretspec/hex/default/<KEY>`.
# Reads use `onepassword_service`, a read-only service account (no Touch ID, so unattended shells
# get the keys too); its token lives in the macOS Keychain
# (`secretspec config provider login onepassword_service`). `onepassword` reads the same vault as
# you, through the desktop app (`op --account my.1password.com`, Touch ID), e.g.
# `secretspec check --provider onepassword`. Adding a key: README "Development shell and model keys".
# Use another store with `--provider`, or on shell entry with `SECRETSPEC_PROVIDER` (devenv then
# resolves the keys too; in an AI agent session also set `SECRETSPEC_REASON`), e.g.
# `SECRETSPEC_PROVIDER=keyring SECRETSPEC_REASON="devenv shell: hex model keys" devenv shell`.
# Service-account reads are cached in the macOS Keychain (`keychain_cache`) for 30 days, so shell
# entry doesn't hit 1Password (and its rate limit) every time. After rotating, revoking or removing
# a key in 1Password: `secretspec cache clear` (or `secretspec cache clear <KEY>`), then reload the
# shell. After a devenv/secretspec update, macOS asks once per cached key: enter the shell
# interactively once and choose Always Allow before agents start shells.
[providers]
keyring = "keyring://"
keychain_cache = "keyring://secretspec/cache/{project}/{profile}/{key}"
onepassword_service = { uri = "onepassword+token://Hex", credentials = { service_account_token = "keyring" }, cache = { provider = "keychain_cache", max_age = "30d" } }
onepassword = "onepassword://my.1password.com@Hex"

[defaults]
providers = ["onepassword_service"]

[profiles.default.defaults]
required = false

[profiles.default]
# Model keys carry the HEX_ prefix (hex maps HEX_<provider variable> onto the model, see
# withHexApiKey in packages/adapters): under the provider's own name (ANTHROPIC_API_KEY, …) the
# exported key can make coding agents started from this shell (claude, omp) bill API usage
# instead of their subscription.
HEX_OPENAI_API_KEY = { description = "OpenAI: an openai/ intake.model, eval model or chat model" }
HEX_ANTHROPIC_API_KEY = { description = "Anthropic: the default Intake and eval model (anthropic/claude-haiku-5-5), another anthropic/ intake.model or eval model, or an anthropic/ chat model" }
HEX_GOOGLE_API_KEY = { description = "Google Gemini: a google/ intake.model, eval model or chat model" }
HEX_SMTP_HOST = { description = "SMTP server for Forwarding (README Intake); in the vault so the public repo names no mail provider" }
HEX_SMTP_PORT = { description = "SMTP port for Forwarding (README Intake); 587 means STARTTLS unless HEX_SMTP_SECURITY says otherwise" }
HEX_SMTP_USER = { description = "SMTP login for Forwarding to SevDesk and paperless-ngx (README Intake)" }
HEX_SMTP_PASSWORD = { description = "SMTP password for Forwarding to SevDesk and paperless-ngx (README Intake)" }
HEX_IMAP_HOST = { description = "IMAP server of the intake mailbox hex watches (README Mailbox); in the vault so the public repo names no mail provider" }
HEX_IMAP_PORT = { description = "IMAP port of the intake mailbox hex watches (README Mailbox); 993 means TLS unless HEX_IMAP_SECURITY says otherwise" }
HEX_IMAP_USER = { description = "IMAP login of the intake mailbox hex watches (README Mailbox)" }
HEX_IMAP_PASSWORD = { description = "IMAP password of the intake mailbox hex watches (README Mailbox)" }
SLACK_APP_TOKEN = { description = "Slack app-level token (xapp-…, scope connections:write) for the socket-mode chat channel (README Slack app for socket mode)" }
SLACK_BOT_TOKEN = { description = "Slack bot user OAuth token (xoxb-…) for the socket-mode chat channel (README Slack app for socket mode)" }
