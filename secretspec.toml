#:schema https://secretspec.dev/schema/secretspec.schema.json
# Model keys for live model runs: `bun run eval`, `bun run intake` and the server's chat model,
# and the SMTP login hex forwards Documents with. Never needed by tests or CI. The devenv shell
# exports them on entry (devenv.nix `enterShell`; see README "Development shell and model keys").
# Optional, so the shell opens without them; a model call without its key fails, and an enabled
# Forwarding target without the SMTP login fails startup and `bun run intake`.

[project]
name = "hex"
revision = "1.0"

# Vault "Hex" in the maintainer's 1Password account `my.1password.com`. Each key is a Secure Note
# `secretspec/hex/default/<KEY>`.
# Reads use `onepassword_service`, a read-only service account (no Touch ID, so unattended shells
# get the keys too); its token lives in the macOS Keychain
# (`secretspec config provider login onepassword_service`). `onepassword` reads the same vault as
# you, through the desktop app (`op --account my.1password.com`, Touch ID), e.g.
# `secretspec check --provider onepassword`. Adding a key: README "Development shell and model keys".
# Use another store with `--provider`, or on shell entry with `SECRETSPEC_PROVIDER` (devenv then
# resolves the keys too; in an AI agent session also set `SECRETSPEC_REASON`), e.g.
# `SECRETSPEC_PROVIDER=keyring SECRETSPEC_REASON="devenv shell: hex model keys" devenv shell`.
[providers]
keyring = "keyring://"
onepassword_service = { uri = "onepassword+token://Hex", credentials = { service_account_token = "keyring" } }
onepassword = "onepassword://my.1password.com@Hex"

[defaults]
providers = ["onepassword_service"]

[profiles.default.defaults]
required = false

[profiles.default]
OPENAI_API_KEY = { description = "OpenAI: an openai/ intake.model, eval model or chat model" }
ANTHROPIC_API_KEY = { description = "Anthropic: the default Intake and eval model (anthropic/claude-haiku-5-5), another anthropic/ model or the chat model" }
GEMINI_API_KEY = { description = "Google Gemini: a google/ intake.model or chat model" }
GOOGLE_GENERATIVE_AI_API_KEY = { description = "Google Gemini key as read by a google/ model through Mastra's router", composed = "${GEMINI_API_KEY}" }
HEX_SMTP_USER = { description = "SMTP login for Forwarding to SevDesk and paperless-ngx (README Intake)" }
HEX_SMTP_PASSWORD = { description = "SMTP password for Forwarding to SevDesk and paperless-ngx (README Intake)" }
