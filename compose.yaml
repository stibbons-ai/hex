# One service, one data volume, the Outbox bind-mounted from the host (ADR 0005). Copy
# .env.example to .env and set HEX_OUTBOX_HOST_DIR first. Built locally; never pushed. Adapted
# from stibbons-ai/iconograph's compose.yaml (MIT).
name: hex
services:
  hex:
    image: hex:local
    build: .
    # Model keys and the other variables in .env.example. Compose gives `environment:` precedence
    # over `env_file:`, and both over the image's ENV, so a .env line can't change the settings
    # below.
    env_file: .env
    environment:
      # Pinned (the image sets the same). HEX_HOST must be the wildcard: a loopback bind inside the
      # container is unreachable through a published port. HEX_PORT must match the container port
      # published below, and the paths the mounts, or the container would be unreachable or lose
      # its data. The port is published on the host's loopback only, so the LAN can't reach it;
      # the Mac itself (through the container's IP) and other containers on this compose network
      # reach port 4111 directly, where only the Host check stands, which browsers can't forge
      # (ADR 0005).
      HEX_HOST: 0.0.0.0
      HEX_PORT: "4111"
      HEX_DATA_DIR: /data
      HEX_OUTBOX_DIR: /outbox
      # Pinned so .env can't turn telemetry on.
      MASTRA_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:4111:4111"
    volumes:
      # LibSQL (mastra.db) and DuckDB (observability.duckdb).
      - hex-data:/data
      # The Outbox only: hex-sync moves Documents on into the Archive from the host. Never mount
      # Proton Drive or the Archive here. The folder must exist; compose doesn't create it.
      - type: bind
        source: ${HEX_OUTBOX_HOST_DIR:?set HEX_OUTBOX_HOST_DIR in .env to the host folder for the Outbox (see .env.example)}
        target: /outbox
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  hex-data:
